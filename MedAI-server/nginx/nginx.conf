# MedAI API Gateway Configuration
# Routes requests to appropriate microservices based on path and query parameters
#
# Port 8002 - External entry point (matches Oracle Cloud security list)
# Routes:
#   /monai/infer?model=chexagent -> vlm:8002
#   /monai/infer?model=*         -> inference:8001
#   /monai/report/*              -> llm:8003
#   /monai/triage/*              -> llm:8003
#   /monai/*                     -> inference:8001

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream definitions
    upstream inference {
        server inference:8001;
        keepalive 32;
    }

    # MedGemma wrapper service (replaces CheXagent)
    # Hostname is still 'vlm' for backward compatibility
    # Port 8005 is the internal container port
    upstream vlm {
        server vlm:8005;
        keepalive 16;
    }

    upstream llm {
        server llm:8003;
        keepalive 16;
    }

    upstream chat {
        server chat:8005;
        keepalive 16;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=inference_limit:10m rate=10r/s;

    # Main server block
    server {
        listen 8002;
        server_name _;

        # Maximum upload size for medical images
        client_max_body_size 500M;
        client_body_buffer_size 16M;

        # Timeouts for long-running inference
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Handle preflight OPTIONS requests
        location @cors_preflight {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        # Health check endpoint
        location /health {
            access_log off;
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            return 200 '{"status":"healthy","service":"api-gateway"}';
        }

        # =============================================
        # Chat Service Routes (clinical decision support)
        # =============================================

        location /chat {
            proxy_pass http://chat;
            # CORS is handled by the FastAPI app - do not add headers here
            # SSE streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            limit_req zone=api_limit burst=10 nodelay;
        }

        # =============================================
        # MedGemma Routes (primary chest X-ray AI)
        # =============================================

        # MedGemma detection endpoint - returns bounding boxes
        location /monai/medgemma/detect {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            rewrite ^/monai/medgemma/detect$ /detect break;
            proxy_pass http://vlm;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            limit_req zone=inference_limit burst=5 nodelay;
        }

        # MedGemma describe endpoint - generates findings description
        location /monai/medgemma/describe {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            rewrite ^/monai/medgemma/describe$ /describe break;
            proxy_pass http://vlm;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            limit_req zone=inference_limit burst=5 nodelay;
        }

        # MedGemma health and info endpoints
        location ~ ^/monai/medgemma/(health|info)$ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            rewrite ^/monai/medgemma/(.*)$ /$1 break;
            proxy_pass http://vlm;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        }

        # =============================================
        # Legacy CheXagent Routes (backward compatibility)
        # =============================================
        # These routes redirect to MedGemma for backward compatibility
        # Match: /monai/infer/chexagent (path-based routing for MONAI Label compatibility)
        location ~ ^/monai/infer/chexagent {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            # Redirect old CheXagent paths to MedGemma detect
            rewrite ^/monai/infer/chexagent(.*)$ /detect break;
            proxy_pass http://vlm;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            limit_req zone=inference_limit burst=5 nodelay;
        }

        # Expose VLM service health and info endpoints for frontend availability checks
        location ~ ^/monai/vlm/(health|info)$ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            rewrite ^/monai/vlm/(.*)$ /$1 break;
            proxy_pass http://vlm;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        }

        # Also support query parameter routing for model selection
        # Match: /monai/infer?model=chexagent
        location ~ ^/monai/infer$ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            # Check if model parameter is chexagent
            if ($arg_model = "chexagent") {
                proxy_pass http://vlm;
            }
            # Default to inference service for other models
            proxy_pass http://inference;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            limit_req zone=inference_limit burst=5 nodelay;
        }

        # Route report generation to LLM service
        location /monai/report {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://llm;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            limit_req zone=api_limit burst=10 nodelay;
        }

        # Route triage requests to LLM service
        location /monai/triage {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://llm;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            limit_req zone=api_limit burst=10 nodelay;
        }

        # Route all other MONAI endpoints to inference service
        location /monai {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://inference;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            limit_req zone=api_limit burst=20 nodelay;
        }

        # Proxy endpoints (Orthanc, etc.) - route to inference
        location /proxy {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://inference/monai/proxy;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            limit_req zone=api_limit burst=50 nodelay;
        }

        # Root redirect to API docs
        location = / {
            return 302 /monai/;
        }

        # Service status endpoint
        location /status {
            access_log off;
            default_type application/json;
            return 200 '{
                "gateway": "healthy",
                "services": {
                    "inference": "http://inference:8001",
                    "medgemma": "http://vlm:8005",
                    "llm": "http://llm:8003"
                }
            }';
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
