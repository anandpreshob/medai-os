# MedAI API Gateway - Cloud (Vertex) mode
# Routes to the CPU orchestrator + chat only. No GPU vlm/llm upstreams (those
# services are absent in the `vertex` compose profile). External entry: :8002.
#
# Routes:
#   /chat        -> chat:8005            (Agent SSE + Q&A)
#   /proxy       -> orchestrator:8001    (Orthanc proxy)
#   /monai/*     -> orchestrator:8001    (/datastore, /batch, /dicomseg, /info)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    upstream orchestrator {
        server orchestrator:8001;
        keepalive 32;
    }

    upstream chat {
        server chat:8005;
        keepalive 16;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    server {
        listen 8002;
        server_name _;

        client_max_body_size 500M;
        client_body_buffer_size 16M;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        location /health {
            access_log off;
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            return 200 '{"status":"healthy","service":"api-gateway-vertex"}';
        }

        # Chat + Agent (SSE streaming)
        location /chat {
            proxy_pass http://chat;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            limit_req zone=api_limit burst=10 nodelay;
        }

        # Orthanc proxy -> orchestrator
        location /proxy {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://orchestrator/monai/proxy;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            limit_req zone=api_limit burst=50 nodelay;
        }

        # All MONAI Label endpoints (/datastore, /batch, /dicomseg, /info) -> orchestrator
        location /monai {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://orchestrator;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            limit_req zone=api_limit burst=20 nodelay;
        }

        location = / {
            return 302 /monai/;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
