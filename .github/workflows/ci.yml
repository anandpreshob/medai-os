name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  viewer-build:
    name: Viewer build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medai-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: medai-viewer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  compose-config:
    name: Compose config validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all compose profiles
        run: |
          cd MedAI-server
          docker compose config -q
          for p in segmentation ai chat; do
            docker compose --profile "$p" config -q
          done

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
